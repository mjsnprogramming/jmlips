# Konfiguracja wdrożenia na Netlify. Next.js jest wykrywany automatycznie
# (Netlify sam dodaje swój adapter dla Next.js).

[build]
  command = "npm run build"
  publish = ".next"
  # Każde wdrożenie produkcyjne kosztuje kredyty z darmowego planu – pomijamy je,
  # gdy zmieniły się tylko pliki dokumentacji (np. CLAUDE.md).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)CLAUDE.md' ':(exclude)README.md'"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
